[project]
name = "review-analyzer"
version = "0.3.0"
description = "Collect Google Play reviews and surface sentiment, recurring complaints and suggested fixes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-play-scraper>=1.2.7",
    "alembic>=1.20.1",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
# Text sentiment and sentence embeddings. Heavy (torch), so the API runs without it.
ml = [
    "transformers>=5.20",
    "torch>=2.14",
]
ui = [
    "streamlit>=1.66",
    "plotly>=7.1",
    "pandas>=3.1",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_analyzer"]

# CPU-only torch wheels: the model runs on CPU and the CUDA build is several GB.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# "a b c".split() reads better than a list literal for long word lists.
ignore = ["SIM905"]

[tool.mypy]
strict = true
packages = ["review_analyzer"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["google_play_scraper.*", "torch.*", "transformers.*", "sklearn.*", "plotly.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
