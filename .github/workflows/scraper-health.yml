name: Scraper health

# The Play Store scraper is unofficial; check daily that it still works so a
# breakage shows up as a failed run (and an email) before a demo visitor hits it.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - run: uv run python scripts/check_scraper.py
